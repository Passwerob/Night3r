name: night3r
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python and core dependencies
  - python>=3.11,<3.12
  - pip
  - setuptools
  - wheel
  
  # PyTorch ecosystem (conda provides better CUDA support)
  - pytorch>=2.5.0
  - pytorch-cuda>=12.1
  - torchvision>=0.15.0
  
  # Scientific computing (better via conda for binary dependencies)
  - numpy>=1.26.0
  - scipy>=1.15.0
  
  # System libraries (conda handles these better)
  - cmake>=3.14.0
  - openssl
  - certifi
  
  # Optional: Jupyter support
  - ipykernel
  - ipython
  
  # Pip packages
  - pip:
      # Computer vision
      - opencv-python>=4.11.0
      - scikit-image>=0.25.0
      - imageio>=2.37.0
      - imageio-ffmpeg>=0.6.0
      
      # Deep learning utilities
      - einops>=0.8.0
      - timm>=1.0.0
      - transformers>=4.53.0
      - huggingface-hub>=0.30.0
      - safetensors>=0.5.0
      - loralib>=0.1.2
      - lpips>=0.1.4
      
      # 3D reconstruction and geometry
      - trimesh>=4.6.0
      - open3d>=0.19.0
      - pycolmap>=3.11.0
      - poselib>=2.0.4
      - pytransform3d>=3.14.0
      - pyquaternion>=0.9.9
      - numpy-quaternion>=2024.0.0
      - roma>=1.5.0
      
      # Evaluation
      - evo>=1.31.0
      
      # Data processing
      - pandas>=2.2.0
      - scikit-learn>=1.6.0
      - joblib>=1.4.0
      
      # Visualization
      - matplotlib>=3.10.0
      - seaborn>=0.13.0
      - plotly>=6.0.0
      - tensorboard>=2.18.0
      
      # Raw image processing
      - rawpy>=0.24.0
      - colour-demosaicing>=0.2.6
      - colour-science>=0.4.6
      
      # Utilities
      - pillow>=10.0.0
      - pyyaml>=6.0.0
      - tqdm>=4.67.0
      - requests>=2.32.0
      - fsspec>=2024.12.0
      - tifffile>=2025.1.0
      - pygltflib>=1.16.0
      - plyfile>=1.1.0
      
      # Optional dependencies (for advanced features)
      - gradio>=4.29.0
      - fastapi>=0.115.0
      - uvicorn>=0.34.0
      - kapture>=1.1.10
      - kapture-localization>=1.1.10
      
      # Development tools (optional)
      - pytest>=8.4.0
      - black>=24.0.0
      - ruff>=0.9.0
      
      # Additional dependencies that may be needed
      - asmk>=0.1
      - faiss-cpu>=1.12.0
      - faiss-gpu-cu12>=1.9.0
      - lightning>=2.5.0
      - pytorch-lightning>=2.5.0
      - torchmetrics>=1.8.0
      - torchinfo>=1.8.0
      
      # Network and async
      - aiohttp>=3.13.0
      - aiofiles>=23.2.0
      - httpx>=0.28.0
      
      # Image and video processing
      - moviepy>=2.2.0
      - exifread>=3.5.0
      - piexif>=1.1.3
      
      # Scientific computing extensions
      - numba>=0.61.0
      - numexpr>=2.10.0
      - cython>=3.0.0
      
      # Additional utilities
      - networkx>=3.3
      - natsort>=8.4.0
      - tabulate>=0.9.0
      - rich>=13.9.0
      - click>=8.1.0
      - typer>=0.15.0
      - pydantic>=2.10.0
      - packaging>=24.0.0
      
      # Optional: Geographic/spatial libraries (if needed)
      - geopandas>=0.14.0
      - rasterio>=1.4.0
      - shapely>=2.0.0
      - pyproj>=3.7.0
      
      # Optional: Additional ML libraries
      - pycocotools>=2.0.10
      - supervision>=0.6.0
