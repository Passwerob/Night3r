precision: "bf16"

model:
  name: "event_dark3r"
  checkpoint: "/data/fcr/data/Night3R/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"
  teacher_checkpoint: null
  freeze_teacher: true
  freeze_student_dark3r_stage1: true
  partial_finetune_blocks: 0

event:
  enabled: true
  num_bins: 4
  polarity_separate: true
  voxel_channels: 8
  normalize: true
  patch_size: null
  copy_dark3r_encoder: true
  freeze_copied_encoder: false

event_norm:
  enabled: true
  use_log_count: true
  use_nonzero_norm: true
  eps: 1.0e-6

event_stat:
  enabled: true
  stat_dim: 3
  include_dt: false
  eps: 1.0e-6

event_film:
  enabled: false
  type: "none"
  hidden_dim: 128
  eta_init: 0.0
  eta_max: 0.1

event_fusion:
  enabled: true
  type: "bounded_reliability"
  inject_layers: "auto"
  init_gate: 0.001
  num_heads: 4
  dropout: 0.0

fusion:
  fusion_type: "brg"
  use_density_film: false
  density_film_type: "none"
  use_channel_modulation: false
  use_source_bias: true
  use_gate_regularization: true

brg:
  stat_dim: 3
  num_sources: 3
  use_source_bias: true
  use_source_stat_norm: true
  source_initial_gate_bias: [0.0, 0.0, -1.25]

  event_stat_mean: [0.0, 0.0, 0.0]
  event_stat_std: [1.0, 1.0, 1.0]
  event_stat_clip: 5.0
  event_stat_learnable_affine: true

  # Fallback repair: keep the residual path much smaller than the previous
  # stage0 repair run. With --init-event-checkpoint, the loaded event_scale_logit
  # is reused but this lower max immediately shrinks the effective scale.
  event_scale_init: 0.012
  event_scale_max: 0.04
  force_event_scale_zero: false

  gate_bias_init: -4.8
  gate_logit_bound: 4.5
  gate_temperature: 1.0
  gate_cap_start: 0.025
  gate_cap_final: 0.08
  gate_cap_warmup_steps: 8000
  occupancy_eps: 0.0

  use_channel_modulation: false
  channel_alpha_start: 0.0
  channel_alpha_final: 0.0
  channel_alpha_max: 0.10
  channel_alpha_warmup_steps: 0

  use_gate_regularization: true
  gate_mean_cap_start: 0.006
  gate_mean_cap_final: 0.020
  gate_mean_cap_warmup_steps: 8000
  low_event_occupancy_thr: 0.03
  low_event_density_thr: 0.05
  logit_reg_bound: 2.8
  gate_mean_reg_weight: 2.0e-2
  gate_low_event_reg_weight: 1.0e-1
  gate_logit_reg_weight: 1.0e-3
  channel_dev_reg_weight: 1.0e-4

dataset:
  type: "dsec_event"
  root:
    - "/data/fcr/data/train_data/MVSEC"
    - "/data/fcr/data/train_data/DSEC"
    - "/data/fcr/data/train_data/DL3DV"
  image_size: [512, 512]
  pair_stride: 1
  pair_sampling: "random"
  min_pair_distance: 1
  max_pair_distance: 7
  precomputed_pairs: null
  allow_reverse_pairs: true
  max_scenes: null
  max_pairs_per_scene: null
  num_workers: 4

lowlight_aug:
  enabled: true
  min_exposure: 0.03
  max_exposure: 0.35
  read_noise_std: 0.01
  shot_noise: true
  gamma_space_input: true

loss:
  dark3r_original: 0.0

  # Strong teacher anchoring is the main guardrail against DL3DV depth-tail
  # expansion. The teacher is the clean RGB MASt3R path.
  feat_distill: 0.18
  structure_consistency: 0.18
  structure_conf_thr: 1.0
  structure_min_scale: 1.0
  structure_max_scale: 1000.0
  structure_max_point_norm: 10000.0
  structure_max_residual: 35.0
  structure_min_valid_fraction: 0.01

  # Preserve event-supported boundaries on MVSEC/DSEC, but do not let DL3DV
  # pseudo-event edges push geometry without depth GT.
  event_depth_edge: 0.05
  event_depth_edge_source_weights:
    mvsec: 1.0
    dsec: 0.5
    dl3dv: 0.0
    default: 1.0

  # Keep only a very weak DL3DV photometric term. Previous runs showed this
  # term can improve warp while still increasing depth p98 tails.
  event_photo: 0.002
  event_photo_source_weights:
    mvsec: 0.25
    dsec: 0.0
    dl3dv: 0.5
    default: 0.0

  depth_gt: 1.0
  depth_gt_source_weights:
    mvsec: 1.0
    dsec: 0.15
    dl3dv: 0.0
    default: 1.0

  depth_gradient_gt: 0.04
  depth_gradient_gt_source_weights:
    mvsec: 1.0
    dsec: 0.25
    dl3dv: 0.0
    default: 1.0
  depth_gradient_image_edge_weight: 1.0
  depth_gradient_event_edge_weight: 0.5
  depth_gradient_log_depth: true

  pose_gt: 0.0
  pose_cycle: 0.0
  normalize_by_active_weight: true
  loss_normalize_target_weight: 1.0
  loss_normalize_min_weight: 1.0e-6
  max_total_loss: 100.0

training:
  stage: 0
  num_epochs: 2
  batch_size: 1
  symmetric_pairs: false
  balanced_dataset_sampling: true
  amp: true
  amp_dtype: "bf16"
  gradient_checkpointing: true
  grad_clip_norm: 1.0
  save_every_epoch: true
  save_every_epoch_fraction: 0.5
  warmup_steps: 500
  warmup_start_factor: 0.05
  lr_event_encoder: 2.0e-6
  lr_fusion_adapter: 3.0e-6
  lr_dark3r: 0.0
  lr_head: 0.0
  stages:
    - name: "brg_dl3dv_stage0_fallback_repair"
      stage: 0
      num_epochs: 2
      partial_finetune_blocks: 0
      warmup_steps: 500
      warmup_start_factor: 0.05
      lr_event_encoder: 2.0e-6
      lr_fusion_adapter: 3.0e-6
      lr_dark3r: 0.0
      lr_head: 0.0

eval:
  every_epochs: 1
  batch_size: 1
  num_workers: 0
  max_batches: 32
