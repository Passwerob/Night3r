# Evaluation-only extreme-dark protocol. RGB is degraded at a fixed exposure;
# the recorded event voxel is left unchanged.
lowlight_aug:
  enabled: true
  min_exposure: 0.05
  max_exposure: 0.05
  read_noise_std: 0.01
  shot_noise: true
  gamma_space_input: true
