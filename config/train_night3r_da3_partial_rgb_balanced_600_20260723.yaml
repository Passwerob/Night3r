# Jointly adapt the event path and only the final two RGB encoder blocks.
# Decoder and geometry heads remain frozen under training stage 4.
loss:
  pseudo_depth_metric_scale_weight: 0.0

training:
  stage: 4
  num_epochs: 4
  partial_finetune_blocks: 2
  save_every_steps: 100
  warmup_steps: 50
  warmup_start_factor: 0.05
  lr_event_encoder: 5.0e-7
  lr_fusion_adapter: 1.0e-6
  lr_dark3r: 1.0e-7
  lr_head: 0.0
  source_sampling_weights:
    dl3dv: 1
    dsec: 1
    mvsec: 1
    default: 0
  stages:
    - name: "da3_partial_rgb_balanced_600_stage4"
      stage: 4
      num_epochs: 4
      partial_finetune_blocks: 2
      warmup_steps: 50
      warmup_start_factor: 0.05
      lr_event_encoder: 5.0e-7
      lr_fusion_adapter: 1.0e-6
      lr_dark3r: 1.0e-7
      lr_head: 0.0
