_base_: train_night3r_da3_depth_repair_shape_800_20260723.yaml

# DA3 predictions were generated with input-extrinsic scale alignment.
# Retain the robust shape term and add a weak direct log-depth scale anchor.
loss:
  pseudo_depth_metric_scale_weight: 0.25

training:
  stages:
    - name: "da3_depth_repair_metric_800_stage0"
      stage: 0
      num_epochs: 4
      partial_finetune_blocks: 0
      warmup_steps: 50
      warmup_start_factor: 0.05
      lr_event_encoder: 1.0e-6
      lr_fusion_adapter: 2.0e-6
      lr_dark3r: 0.0
      lr_head: 0.0
