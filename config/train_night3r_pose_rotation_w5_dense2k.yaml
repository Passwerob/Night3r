_base_: train_night3r_pose_head_sweep_5k.yaml

# The geodesic term remains active. Near identity, the chordal term has the
# same angular scale, giving an effective rotation weight of about 5x.
loss:
  pose_rotation_weight: 1.0
  pose_rotation_chordal_weight: 4.0

training:
  checkpoint_mode: "pose_head_only"
  save_every_steps: 200
