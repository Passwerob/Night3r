_base_: train_night3r_mvsec_only_adapt_1k_from_best.yaml

# Continue the final geometry checkpoint on original RGB frames from all three
# training sources. No synthetic exposure scaling or sensor noise is applied.
dataset:
  root:
    - "/data/fcr/data/train_data/MVSEC"
    - "/data/fcr/data/Night3R/outputs/splits/night3r_dsec_holdout_v1/dsec_train"
    - "/data/fcr/data/train_data/DL3DV"
  pair_sampling: "random"
  min_pair_distance: 1
  max_pair_distance: 3
  allow_reverse_pairs: true
  num_workers: 4

lowlight_aug:
  enabled: false

loss:
  depth_gt_source_weights:
    mvsec: 1.0
    dsec: 0.0
    dl3dv: 0.0
    default: 0.0

training:
  num_epochs: 1
  batch_size: 1
  balanced_dataset_sampling: true
  warmup_steps: 150
  save_every_epoch: false
  save_every_steps: 500
  stages:
    - name: "rawrgb_nodarken_ft1k_stage0"
      stage: 0
      num_epochs: 1
      partial_finetune_blocks: 0
      warmup_steps: 150
      warmup_start_factor: 0.05
      lr_event_encoder: 1.0e-6
      lr_fusion_adapter: 2.0e-6
      lr_dark3r: 0.0
      lr_head: 0.0

eval:
  every_epochs: 0
