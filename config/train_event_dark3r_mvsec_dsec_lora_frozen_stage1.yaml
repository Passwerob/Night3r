model:
  name: "event_dark3r"
  checkpoint: "/data/fcr/data/Night3R/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"
  teacher_checkpoint: null
  backbone_lora_checkpoint: "/data/fcr/data/Night3R/checkpoints/dark3r_pretrained/weights/0049_lora.pth"
  freeze_teacher: true
  freeze_student_dark3r_stage1: true
  partial_finetune_blocks: 0

event:
  enabled: true
  num_bins: 4
  polarity_separate: true
  voxel_channels: 8
  normalize: true
  patch_size: null
  copy_dark3r_encoder: true
  freeze_copied_encoder: true

event_fusion:
  enabled: true
  type: "gated_cross_attention"
  inject_layers: "auto"
  init_gate: 0.001
  num_heads: 4
  dropout: 0.0

dataset:
  type: "dsec_event"
  root:
    - "/data/fcr/data/train_data/MVSEC"
    - "/data/fcr/data/train_data/DSEC"
  image_size: [512, 512]
  pair_stride: 1
  pair_sampling: "random"
  min_pair_distance: 1
  max_pair_distance: 7
  precomputed_pairs: null
  allow_reverse_pairs: true
  max_scenes: null
  max_pairs_per_scene: null
  num_workers: 4

lowlight_aug:
  enabled: true
  min_exposure: 0.03
  max_exposure: 1.0
  read_noise_std: 0.01
  shot_noise: true
  gamma_space_input: true

loss:
  dark3r_original: 0.0
  feat_distill: 0.05
  structure_consistency: 0.05
  structure_conf_thr: 1.0
  structure_min_scale: 1.0
  structure_max_scale: 1000.0
  structure_max_point_norm: 10000.0
  structure_max_residual: 50.0
  structure_min_valid_fraction: 0.01
  event_depth_edge: 0.02
  event_photo: 0.0
  depth_gt: 1.0
  depth_gt_source_weights:
    mvsec: 1.0
    dsec: 0.25
    default: 1.0
  pose_gt: 0.0
  pose_cycle: 0.0
  normalize_by_active_weight: true
  loss_normalize_target_weight: 1.0
  loss_normalize_min_weight: 1e-6
  max_total_loss: 100.0

training:
  stage: 1
  num_epochs: 1
  batch_size: 1
  symmetric_pairs: false
  amp: true
  amp_dtype: "fp16"
  gradient_checkpointing: true
  grad_clip_norm: 1.0
  save_every_epoch: true
  save_every_epoch_fraction: 0.5
  warmup_steps: 200
  warmup_start_factor: 0.2
  lr_event_encoder: 5e-5
  lr_fusion_adapter: 5e-5
  lr_dark3r: 0.0
  lr_head: 0.0
  stages:
    - name: "dark3r_lora_frozen_event_patch_fusion"
      stage: 1
      num_epochs: 1
      partial_finetune_blocks: 0
      warmup_steps: 200
      warmup_start_factor: 0.2
      lr_event_encoder: 5e-5
      lr_fusion_adapter: 5e-5
      lr_dark3r: 0.0
      lr_head: 0.0

eval:
  every_epochs: 1
  batch_size: 1
  num_workers: 0
  max_batches: 32
