_base_: train_night3r_mvsec_only_adapt_1k_from_best.yaml

pose_head:
  enabled: true
  hidden_dim: 512
  pool_hidden_dim: 128
  dropout: 0.1

fusion:
  use_gate_regularization: false

brg:
  use_gate_regularization: false

dataset:
  root:
    - "/data/fcr/data/train_data/MVSEC"
    - "/data/fcr/data/train_data/DL3DV"
  pair_sampling: "random"
  min_pair_distance: 1
  max_pair_distance: 3
  allow_reverse_pairs: true
  pose_output_convention: "opencv"
  # Exclude every MVSEC scene recorded in the current paper test inventory.
  exclude_scenes:
    - "screen-000020-mvsec"
    - "screen-000050-mvsec"
    - "screen-000095-mvsec"
    - "screen-000110-mvsec"
    - "screen-000115-mvsec"
    - "screen-000122-mvsec"
    - "screen-000123-mvsec"
    - "screen-000129-mvsec"
    - "screen-000144-mvsec"
    - "screen-000156-mvsec"
    - "screen-000157-mvsec"
    - "screen-000170-mvsec"
    - "screen-000200-mvsec"
    - "screen-000205-mvsec"
    - "screen-000207-mvsec"
    - "screen-000208-mvsec"
    - "screen-000220-mvsec"
    - "screen-000226-mvsec"
  num_workers: 4

lowlight_aug:
  enabled: true
  apply_sources: ["dl3dv"]

loss:
  dark3r_original: 0.0
  feat_distill: 0.0
  structure_consistency: 0.0
  event_depth_edge: 0.0
  event_photo: 0.0
  depth_gt: 0.0
  depth_gradient_gt: 0.0
  pose_gt: 1.0
  pose_cycle: 0.0
  pose_rotation_weight: 1.0
  pose_translation_weight: 1.0
  pose_min_translation_norm: 1.0e-3
  pose_gt_source_weights:
    mvsec: 1.0
    dl3dv: 1.0
    default: 0.0
  normalize_by_active_weight: true
  max_total_loss: 10.0

training:
  pose_head_only: true
  stage: 0
  num_epochs: 2
  batch_size: 2
  symmetric_pairs: false
  balanced_dataset_sampling: true
  amp: true
  amp_dtype: "bf16"
  gradient_checkpointing: false
  grad_clip_norm: 1.0
  save_every_epoch: false
  save_every_epoch_fraction: 1.0
  warmup_steps: 200
  warmup_start_factor: 0.05
  lr_event_encoder: 0.0
  lr_fusion_adapter: 0.0
  lr_dark3r: 0.0
  lr_head: 0.0
  lr_pose_head: 3.0e-4
  stages:
    - name: "pose_head_only"
      stage: 0
      num_epochs: 2
      partial_finetune_blocks: 0
      warmup_steps: 200
      warmup_start_factor: 0.05
      lr_event_encoder: 0.0
      lr_fusion_adapter: 0.0
      lr_dark3r: 0.0
      lr_head: 0.0
      lr_pose_head: 3.0e-4

eval:
  every_epochs: 0
  batch_size: 2
  num_workers: 2
  max_batches: 64
