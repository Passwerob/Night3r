_base_: train_night3r_final_step100_pose_adapt100.yaml

dataset:
  root: "/data/fcr/data/train_data/MVSEC"
  pair_sampling: "fixed"
  pose_output_convention: "opencv"
  num_workers: 2
  # Paper-test scenes, internal visualization candidates, and the independent
  # pose validation clips with their immediate temporal neighbors.
  exclude_scenes:
    - "screen-000020-mvsec"
    - "screen-000050-mvsec"
    - "screen-000095-mvsec"
    - "screen-000110-mvsec"
    - "screen-000115-mvsec"
    - "screen-000122-mvsec"
    - "screen-000123-mvsec"
    - "screen-000129-mvsec"
    - "screen-000144-mvsec"
    - "screen-000156-mvsec"
    - "screen-000157-mvsec"
    - "screen-000170-mvsec"
    - "screen-000200-mvsec"
    - "screen-000205-mvsec"
    - "screen-000207-mvsec"
    - "screen-000208-mvsec"
    - "screen-000220-mvsec"
    - "screen-000226-mvsec"
    - "screen-000033-mvsec"
    - "screen-000034-mvsec"
    - "screen-000035-mvsec"
    - "screen-000081-mvsec"
    - "screen-000082-mvsec"
    - "screen-000083-mvsec"
    - "screen-000179-mvsec"
    - "screen-000180-mvsec"
    - "screen-000181-mvsec"
    - "screen-000036-mvsec"
    - "screen-000037-mvsec"
    - "screen-000038-mvsec"
    - "screen-000063-mvsec"
    - "screen-000064-mvsec"
    - "screen-000065-mvsec"
    - "screen-000068-mvsec"
    - "screen-000069-mvsec"
    - "screen-000070-mvsec"

pose_triplet:
  min_stride: 1
  max_stride: 3
  pair_weight: 1.0
  cycle_weight: 0.5
  max_steps: 2000
  save_every_steps: 200

training:
  pose_head_only: true
  checkpoint_mode: "pose_head_only"
  batch_size: 1
  grad_clip_norm: 1.0
  lr_event_encoder: 0.0
  lr_fusion_adapter: 0.0
  lr_dark3r: 0.0
  lr_head: 0.0
  lr_pose_head: 1.0e-4
  stages:
    - name: "mvsec_pose_triplet_clean"
      stage: 0
      partial_finetune_blocks: 0
      lr_event_encoder: 0.0
      lr_fusion_adapter: 0.0
      lr_dark3r: 0.0
      lr_head: 0.0
      lr_pose_head: 1.0e-4
